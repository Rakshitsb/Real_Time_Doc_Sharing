# Real-Time Doc Sharing — Docker Compose
#
# Quick start:
#   1. cp backend/.env.example backend/.env   (then set your secrets)
#   2. docker compose up --build
#   3. Open http://localhost:8080
#
# For backend-only dev (use `npm run dev` for frontend):
#   docker compose up mongo backend

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: rtdocs_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rtdocs_net

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtdocs_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/rtdocs
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - rtdocs_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
        VITE_APP_ENV: production
    container_name: rtdocs_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rtdocs_net

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  mongo_data:
    name: rtdocs_mongo_data
  backend_logs:
    name: rtdocs_backend_logs

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  rtdocs_net:
    name: rtdocs_network
    driver: bridge
